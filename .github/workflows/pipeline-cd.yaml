name: Pipeline CD

on:
  workflow_run:
    workflows: ["Pipeline CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          DAY=$(date +%d)
          TAG="1.${YEAR}.${MONTH}${DAY}.${{ github.event.workflow_run.run_number }}"
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Load image API into Kind
        run: kind load docker-image esperanca-solidaria-api:${{ env.IMAGE_TAG }} --name fiap

      - name: Load image Worker into Kind
        run: kind load docker-image esperanca-solidaria-worker-doacao-realizada:${{ env.IMAGE_TAG }} --name fiap

      - name: Replace image tag in deployment-api.yaml
        run: |
          sed -i "s|image: esperanca-solidaria-api:.*|image: esperanca-solidaria-api:${IMAGE_TAG}|g" infra-as-code/k8s/deployment-api.yaml

      - name: Replace image tag in deployment-worker.yaml
        run: |
          sed -i "s|image: esperanca-solidaria-worker-doacao-realizada:.*|image: esperanca-solidaria-worker-doacao-realizada:${IMAGE_TAG}|g" infra-as-code/k8s/deployment-worker.yaml

      - name: Apply Kubernetes manifests API
        run: kubectl apply -f infra-as-code/k8s/deployment-api.yaml -n app

      - name: Apply Kubernetes manifests Worker
        run: kubectl apply -f infra-as-code/k8s/deployment-worker.yaml -n app