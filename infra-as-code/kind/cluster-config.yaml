# cluster-config.yml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30000
    hostPort: 8080
  - containerPort: 30001
    hostPort: 1433
  - containerPort: 30002
    hostPort: 5672
  - containerPort: 30003
    hostPort: 15672
  - containerPort: 30004
    hostPort: 9090
  - containerPort: 30005
    hostPort: 3000
  - containerPort: 30006
    hostPort: 27017
  - containerPort: 30007
    hostPort: 3100
  - containerPort: 30008
    hostPort: 3200