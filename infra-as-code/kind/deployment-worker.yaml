apiVersion: apps/v1
kind: Deployment
metadata:
  name: esperanca-solidaria-worker-doacao-realizada
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esperanca-solidaria-worker-doacao-realizada
  template:
    metadata:
      labels:
        app: esperanca-solidaria-worker-doacao-realizada
    spec:
      containers:
        - name: api
          image: esperanca-solidaria-worker-doacao-realizada:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: esperanca-solidaria-worker-doacao-realizada-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: esperanca-solidaria-worker-doacao-realizada-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: esperanca-solidaria-worker-doacao-realizada
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 1
          periodSeconds: 30
      selectPolicy: Max