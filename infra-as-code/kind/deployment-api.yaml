apiVersion: apps/v1
kind: Deployment
metadata:
  name: esperanca-solidaria-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esperanca-solidaria-api
  template:
    metadata:
      labels:
        app: esperanca-solidaria-api
    spec:
      containers:
        - name: api
          image: esperanca-solidaria-api:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: esperanca-solidaria-api-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: esperanca-solidaria-api-service
  labels:
    app: esperanca-solidaria-api
spec:
  type: NodePort
  selector:
    app: esperanca-solidaria-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30000
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: esperanca-solidaria-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: esperanca-solidaria-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 1
          periodSeconds: 30
      selectPolicy: Max